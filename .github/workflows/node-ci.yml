name: Node.js CI

on:
  push:
    branches: [ "main", "testing-upgrade" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x' 

    - name: Install Dependencies
      run: npm install

    - name: Run Unit and Integration Tests
      run: npm test